name: Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Prepare centralized SDK test contract
        shell: pwsh
        run: |
          $adb = 'D:\vibecoding\sdk\android\platform-tools\adb.exe'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $adb) | Out-Null
          New-Item -ItemType File -Force -Path $adb | Out-Null
      - name: Rust format
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace
      - name: Rust clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Windows contract tests
        run: dotnet run --project src/AndroidSimulator.App.Tests/AndroidSimulator.App.Tests.csproj -c Release
      - name: WinUI release build
        run: dotnet build src/AndroidSimulator.App/AndroidSimulator.App.csproj -c Release -p:Platform=x64

  scrcpy-patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify enhanced scrcpy patch stack
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o scrcpy.zip https://github.com/Genymobile/scrcpy/archive/refs/tags/v4.1.zip
          unzip -q scrcpy.zip
          patch -d scrcpy-4.1 -p1 < native/scrcpy-enhanced/androidsimulator-scrcpy-4.1.patch
          patch -d scrcpy-4.1 -p1 < native/scrcpy-enhanced/androidsimulator-scrcpy-4.1-performance.patch

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, scrcpy-patches]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release control layer
        run: cargo build --manifest-path rust/Cargo.toml -p simulatorctl -p androidsimulator-apkicon --release
      - name: Publish WinUI release payload
        shell: pwsh
        run: |
          dotnet publish src/AndroidSimulator.App/AndroidSimulator.App.csproj -c Release -r win-x64 --self-contained false -p:Platform=x64 -o release-payload
          foreach ($required in @('AndroidSimulator.App.exe', 'simulatorctl.exe', 'AndroidSimulator.ApkIcon.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path 'release-payload' $required) -PathType Leaf)) {
              throw "Release payload missing $required"
            }
          }
      - name: Build installer payload
        shell: pwsh
        run: |
          $payloadDir = 'installer/AndroidSimulator.Installer/Payload'
          New-Item -ItemType Directory -Force -Path $payloadDir | Out-Null
          $payloadZip = Join-Path $payloadDir 'app.zip'
          if (Test-Path -LiteralPath $payloadZip) { Remove-Item -LiteralPath $payloadZip -Force }
          Compress-Archive -Path 'release-payload/*' -DestinationPath $payloadZip -CompressionLevel Optimal
          dotnet publish installer/AndroidSimulator.Installer/AndroidSimulator.Installer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o installer-out
          Copy-Item -LiteralPath 'installer-out/AndroidSimulator.Setup.exe' -Destination 'AndroidSimulator-Setup.exe' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidSimulator-Setup
          path: AndroidSimulator-Setup.exe
          if-no-files-found: error
      - name: Update formal v1.1.0 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.1.0 AndroidSimulator-Setup.exe --clobber
